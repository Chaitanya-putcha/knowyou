<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowYou | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-white min-h-screen">
    <div class="flex min-h-screen items-center justify-center px-4 py-10">
      <main class="w-full max-w-md rounded-2xl border border-white/10 bg-slate-900 p-8 shadow-xl">
        <div class="mb-8">
          <p class="text-sm font-semibold uppercase tracking-[0.2em] text-violet-300">KnowYou</p>
          <h1 class="mt-2 text-3xl font-bold text-white">Welcome back</h1>
          <p class="mt-2 text-slate-400">Log in to continue your journal.</p>
        </div>

            <form id="login-form" class="space-y-5">
              <div>
                <label for="email" class="mb-2 block text-sm text-slate-300">Email address</label>
                <input id="email" type="email" required class="w-full rounded-2xl border border-white/10 bg-slate-800/90 px-4 py-3 text-white placeholder:text-slate-400 focus:border-violet-400 focus:outline-none" placeholder="you@example.com" />
              </div>

              <div>
                <label for="password" class="mb-2 block text-sm text-slate-300">Password</label>
                <input id="password" type="password" required class="w-full rounded-2xl border border-white/10 bg-slate-800/90 px-4 py-3 text-white placeholder:text-slate-400 focus:border-violet-400 focus:outline-none" placeholder="Enter your password" />
              </div>

              <button type="submit" class="w-full rounded-2xl bg-gradient-to-r from-violet-500 to-cyan-500 px-4 py-3 text-base font-semibold text-white shadow-glow transition hover:brightness-110">Login</button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-300">
              Don’t have an account?
              <a href="/signup.html" class="font-semibold text-violet-300 hover:text-violet-200">Create one</a>
            </p>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
